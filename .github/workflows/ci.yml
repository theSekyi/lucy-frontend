name: Frontend Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Unit & DOM Tests, Build, Bundle Budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict TypeScript check
        run: pnpm typecheck

      - name: Run unit, architectural, hygiene, and Preact DOM tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Enforce <= 30 KB Brotli critical boot budget
        run: node scripts/benchmark.mjs
